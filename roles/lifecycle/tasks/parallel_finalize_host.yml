---
- name: Restore parallel target host context
  ansible.builtin.set_fact:
    serviceflow_target_host: "{{ serviceflow_parallel_host_context.host }}"
    serviceflow_transition_needed: "{{ serviceflow_parallel_host_context.transition_needed | bool }}"
    serviceflow_initial_active_state: "{{ serviceflow_parallel_host_context.initial_active_state }}"
    serviceflow_initial_sub_state: "{{ serviceflow_parallel_host_context.initial_sub_state }}"
    serviceflow_systemd_result: >-
      {{
        serviceflow_parallel_systemd_results.get(
          serviceflow_parallel_host_context.host,
          {'changed': false}
        )
      }}
    serviceflow_final_active_state: >-
      {{
        none
        if ansible_check_mode
        else serviceflow_parallel_final_states[serviceflow_parallel_host_context.host].active_state
      }}
    serviceflow_final_sub_state: >-
      {{
        none
        if ansible_check_mode
        else serviceflow_parallel_final_states[serviceflow_parallel_host_context.host].sub_state
      }}
    serviceflow_log_boundary_result: >-
      {{
        serviceflow_parallel_log_boundaries.get(
          serviceflow_parallel_host_context.host,
          {}
        )
      }}

- name: Verify systemd readiness after parallel start
  ansible.builtin.include_tasks: readiness.yml
  when:
    - serviceflow_phase.action == 'start'
    - serviceflow_current_service.ready is not none
    - serviceflow_current_service.ready.type == 'systemd'
    - not ansible_check_mode

- name: Verify log readiness after parallel start
  ansible.builtin.include_tasks: log_readiness.yml
  when:
    - serviceflow_phase.action == 'start'
    - serviceflow_current_service.ready is not none
    - serviceflow_current_service.ready.type == 'log'
    - not ansible_check_mode

- name: Run hooks after parallel readiness
  ansible.builtin.include_tasks: hooks.yml
  vars:
    serviceflow_hook_phase: after_ready
  when:
    - serviceflow_phase.action == 'start'
    - serviceflow_current_service.ready is not none
    - serviceflow_transition_needed | bool
    - not ansible_check_mode

- name: Run hooks after parallel stop transition
  ansible.builtin.include_tasks: hooks.yml
  vars:
    serviceflow_hook_phase: after_stop
  when:
    - serviceflow_phase.action == 'stop'
    - serviceflow_transition_needed | bool
    - not ansible_check_mode

- name: Record parallel lifecycle operation
  ansible.builtin.set_fact:
    serviceflow_result: >-
      {{
        serviceflow_result
        | combine(
            {
              'processed': serviceflow_result.processed
              + [
                  {
                    'action': serviceflow_phase.action,
                    'service': serviceflow_current_service.name,
                    'unit': serviceflow_current_service.unit,
                    'host': serviceflow_target_host,
                    'changed': (
                      serviceflow_transition_needed | bool
                      if ansible_check_mode
                      else serviceflow_systemd_result.changed | bool
                    ),
                    'predicted_change': serviceflow_transition_needed | bool,
                    'transition_needed': serviceflow_transition_needed | bool,
                    'initial_active_state': serviceflow_initial_active_state,
                    'initial_sub_state': serviceflow_initial_sub_state,
                    'desired_active_state': (
                      'active' if serviceflow_phase.action == 'start' else 'inactive'
                    ),
                    'final_active_state': serviceflow_final_active_state,
                    'final_sub_state': serviceflow_final_sub_state,
                    'check_mode': ansible_check_mode | bool
                  }
                ]
            }
          )
      }}
